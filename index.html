<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ONOKOS – Cari Kos Sekitar Kampus UMM</title>
<meta name="description" content="Cari kos di sekitar UMM Malang berdasarkan harga, jarak, dan fasilitas. Hubungi pemilik langsung lewat WhatsApp.">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8fafc;--card:#fff;--ink:#0b1f4b;--mut:#5a6b8c;--line:#e1e7f0;--acc:#1e3a8a;--acc-ink:#fff;--ok:#16794a;--no:#c62828}
@media(prefers-color-scheme:dark){:root{--bg:#0a1228;--card:#131d3a;--ink:#eef2fb;--mut:#9aa8c8;--line:#26335a;--acc:#4a67d6;--ok:#4ade80;--no:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0)}
.hero{background:linear-gradient(135deg,#0b1f4b,#1e3a8a);color:#fff;padding-top:env(safe-area-inset-top,0);padding-bottom:64px}
.hero .sub{color:#c7d2ee;margin:0}
.hero .logo b{background:#fff;color:#0b1f4b}
.hero .btn.alt{color:#fff;border-color:rgba(255,255,255,.55)}
.panel{margin-top:-44px;box-shadow:0 10px 28px rgba(11,31,75,.14)}
.card{box-shadow:0 2px 8px rgba(11,31,75,.08)}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
.logo{font-weight:800;font-size:1.4rem;letter-spacing:-.02em}
.logo b{background:var(--acc);color:var(--acc-ink);padding:0 6px;border-radius:6px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--acc);color:var(--acc-ink)}
.btn.alt{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-within{outline:3px solid var(--acc);outline-offset:2px}
h1{font-size:clamp(1.8rem,5vw,3rem);line-height:1.1;letter-spacing:-.03em;margin:8px 0 6px;font-weight:800;max-width:16ch}
.sub{color:var(--mut);margin:0 0 20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
label.f{display:grid;gap:4px;font-size:.85rem;color:var(--mut)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
.span{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:.9rem;background:var(--bg)}
.chip input{width:auto;accent-color:var(--acc)}
.chip:has(input:checked){background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.bar{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px;color:var(--mut);flex-wrap:wrap;gap:8px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));padding-bottom:90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.pic{aspect-ratio:16/10;background:linear-gradient(135deg,#8da2c4,#5a6f96);display:grid;place-items:center;font-size:2.6rem;position:relative}
.pic svg{position:absolute;inset:0;width:100%;height:100%}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tag{position:absolute;left:10px;top:10px;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--card);color:var(--ink)}
.tag.v{color:var(--ok)}.tag.n{color:var(--no)}
.body{padding:14px;display:grid;gap:6px;flex:1}
.body h3{margin:0;font-size:1.1rem}
.price{font-weight:800;font-size:1.2rem}.price small{font-weight:400;color:var(--mut)}
.meta{color:var(--mut);font-size:.9rem}
.acts{display:flex;gap:8px;padding:0 14px 14px}.acts .btn{flex:1;padding:8px}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:40px 0}
dialog{border:0;border-radius:18px;padding:0;max-width:560px;width:calc(100% - 24px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg{padding:20px;display:grid;gap:12px;max-height:85vh;overflow:auto}
.dlg h2{margin:0}
.x{justify-self:end}
.cmp{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:420px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;font-size:.92rem;vertical-align:top}
#cmpbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0));display:none;justify-content:center;gap:10px;align-items:center;flex-wrap:wrap}
footer{color:var(--mut);font-size:.85rem;padding:0 0 100px}
</style>
</head>
<body>
<div class="hero"><div class="wrap">
<header><div class="logo">ONO<b>KOS</b></div><button class="btn alt" id="add">+ Pasang kos</button></header>
<h1>Cari kos dekat kampus UMM.</h1>
<p class="sub">Saring harga, jarak, dan fasilitas, lalu hubungi pemilik lewat WhatsApp.</p>
</div></div>
<div class="wrap">

<section class="panel" aria-label="Filter">
<label class="f span">Cari nama atau alamat<input id="q" type="search" placeholder="mis. Tlogomas"></label>
<label class="f">Harga maks (per bulan)<select id="fp"><option value="0">Semua harga</option><option value="500000">Rp500 rb</option><option value="800000">Rp800 rb</option><option value="1200000">Rp1,2 juta</option><option value="2000000">Rp2 juta</option></select></label>
<label class="f">Jarak maks ke kampus<select id="fd"><option value="0">Semua jarak</option><option value="0.3">300 m</option><option value="0.5">500 m</option><option value="1">1 km</option><option value="2">2 km</option></select></label>
<label class="f">Tipe<select id="ft"><option value="">Semua</option><option>Putra</option><option>Putri</option><option>Campur</option></select></label>
<label class="f">Urutkan<select id="fs"><option value="d">Terdekat</option><option value="pa">Harga terendah</option><option value="pd">Harga tertinggi</option></select></label>
<div class="span chips" id="fac" role="group" aria-label="Fasilitas"></div>
<label class="chip span" style="justify-self:start"><input type="checkbox" id="fv"> Hanya yang ada kamar kosong</label>
</section>

<div class="bar"><span id="count"></span><button class="btn alt" id="reset">Reset filter</button></div>
<div class="grid" id="list"></div>
<footer>Prototipe ONOKOS. Data contoh (fiktif) di sekitar UMM, Malang. Kos yang kamu pasang tersimpan di perangkat ini saja.</footer>
</div>

<div id="cmpbar"><span id="cmpn"></span><button class="btn" id="cmpgo">Bandingkan</button><button class="btn alt" id="cmpclr">Kosongkan</button></div>

<dialog id="dd"><div class="dlg" id="ddc"></div></dialog>
<dialog id="dc"><div class="dlg"><button class="btn alt x" data-close>Tutup</button><h2>Perbandingan</h2><div class="cmp" id="cmpt"></div></div></dialog>
<dialog id="da"><form class="dlg" id="af" method="dialog">
<h2>Pasang kos</h2>
<label class="f">Nama kos<input name="nama" required></label>
<label class="f">Alamat<input name="alamat" required></label>
<label class="f">Harga per bulan (Rp)<input name="harga" type="number" min="50000" step="10000" required></label>
<label class="f">Jarak ke kampus (km)<input name="jarak" type="number" min="0" step="0.1" required></label>
<label class="f">Tipe<select name="tipe"><option>Putra</option><option>Putri</option><option>Campur</option></select></label>
<label class="f">Nomor WhatsApp (mis. 0812xxxx)<input name="wa" inputmode="tel" required></label>
<label class="f">Link foto (opsional)<input name="foto" type="url" placeholder="https://..."></label>
<div class="f">Fasilitas<div class="chips" id="af-fac"></div></div>
<label class="chip" style="justify-self:start"><input type="checkbox" name="kosong" checked> Ada kamar kosong</label>
<div style="display:flex;gap:8px"><button class="btn" type="submit">Simpan kos</button><button class="btn alt" type="button" data-close>Batal</button></div>
</form></dialog>

3pvqo5traZzQ8D5Ewa/fegggmtA9n/2Q==",nama:"Kos Sederhana Landungsari",alamat:"Jl. Landungsari 20",harga:400000,jarak:1.9,tipe:"Campur",wa:"081200000006",kosong:true,fac:["Parkir"],upd:"2026-09-30"}
];
const $=s=>document.querySelector(s);
const rp=n=>"Rp"+n.toLocaleString("id-ID");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let mine=[];try{mine=JSON.parse(localStorage.getItem("onokos_mine")||"[]")}catch(e){}
const save=()=>{try{localStorage.setItem("onokos_mine",JSON.stringify(mine))}catch(e){}};
let cmp=[];
const all=()=>[...mine,...SAMPLE];
const chip=(n,v,name)=>`<label class="chip"><input type="checkbox" ${name?`name="${name}"`:"data-f"} value="${v}"> ${v}</label>`;
$("#fac").innerHTML=FAC.map(f=>chip(0,f)).join("");
$("#af-fac").innerHTML=FAC.map(f=>chip(0,f,"fac")).join("");

function filtered(){
 const q=$("#q").value.trim().toLowerCase(),p=+$("#fp").value,d=+$("#fd").value,t=$("#ft").value,v=$("#fv").checked;
 const fs=[...document.querySelectorAll("[data-f]:checked")].map(x=>x.value);
 let r=all().filter(k=>(!q||(k.nama+" "+k.alamat).toLowerCase().includes(q))&&(!p||k.harga<=p)&&(!d||k.jarak<=d)&&(!t||k.tipe===t)&&(!v||k.kosong)&&fs.every(f=>k.fac.includes(f)));
 const s=$("#fs").value;
 r.sort(s==="pa"?(a,b)=>a.harga-b.harga:s==="pd"?(a,b)=>b.harga-a.harga:(a,b)=>a.jarak-b.jarak);
 return r;
}
function render(){
 const r=filtered();
 $("#count").textContent=r.length+" kos ditemukan";
 $("#list").innerHTML=r.length?r.map(k=>`<article class="card">
  <div class="pic">${pic(k)}<span class="tag ${k.kosong?"v":"n"}">${k.kosong?"Ada kamar kosong":"Penuh"}</span></div>
  <div class="body"><h3>${esc(k.nama)}</h3><div class="price">${rp(k.harga)} <small>/ bulan</small></div>
  <div class="meta">${k.tipe} · ${k.jarak<1?Math.round(k.jarak*1000)+" m":k.jarak+" km"} ke kampus</div>
  <div class="meta">${k.fac.map(esc).join(", ")||"Fasilitas belum diisi"}</div></div>
  <div class="acts"><button class="btn" data-d="${k.id}">Lihat detail</button><label class="chip"><input type="checkbox" data-c="${k.id}" ${cmp.includes(k.id)?"checked":""}> Banding</label></div>
 </article>`).join(""):`<div class="empty">Tidak ada kos yang cocok. Longgarkan filter atau tekan Reset filter.</div>`;
}
function pic(k){
 const h=[...k.id].reduce((a,c)=>a+c.charCodeAt(0),0)%4;
 const wall=["#dfe8f7","#f7ecd3","#e3f1e6","#f3e1e6"][h],bed=["#27418a","#b5651d","#2e7d5b","#a23b5a"][h];
 const svg=`<svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="320" height="200" fill="${wall}"/><rect y="150" width="320" height="50" fill="#b99a74"/><rect x="215" y="28" width="70" height="80" rx="4" fill="#bfe3ff" stroke="#fff" stroke-width="5"/><path d="M250 28v80M215 68h70" stroke="#fff" stroke-width="3"/><rect x="30" y="100" width="150" height="50" rx="6" fill="${bed}"/><rect x="30" y="86" width="42" height="26" rx="8" fill="#fff"/><rect x="26" y="120" width="158" height="12" rx="3" fill="#fff" opacity=".25"/><rect x="30" y="150" width="6" height="14" fill="#6b4f33"/><rect x="174" y="150" width="6" height="14" fill="#6b4f33"/><rect x="195" y="120" width="26" height="30" rx="3" fill="#6b4f33"/><circle cx="208" cy="112" r="8" fill="#f2b705"/></svg>`;
 const img=k.foto?`<img src="${esc(k.foto)}" alt="Foto ${esc(k.nama)}" loading="lazy" onerror="this.remove()">`:"";
 return svg+img;
}
function wa(k){const n=k.wa.replace(/\D/g,"").replace(/^0/,"62");return `https://wa.me/${n}?text=${encodeURIComponent("Halo, saya lihat "+k.nama+" di ONOKOS. Apakah masih ada kamar kosong?")}`}
function detail(id){
 const k=all().find(x=>x.id===id);if(!k)return;
 $("#ddc").innerHTML=`<button class="btn alt x" data-close>Tutup</button><div class="pic" style="border-radius:12px;overflow:hidden">${pic(k)}</div><h2>${esc(k.nama)}</h2>
 <div class="price">${rp(k.harga)} <small>/ bulan</small></div>
 <div>${esc(k.alamat)}, Malang</div><div class="meta">${k.tipe} · ${k.jarak} km ke kampus · ${k.kosong?"Ada kamar kosong":"Penuh"}</div>
 <div class="chips">${k.fac.map(f=>`<span class="chip">${esc(f)}</span>`).join("")}</div>
 <div class="meta">Terakhir diperbarui: ${esc(k.upd||"-")}</div>
 <a class="btn" style="text-align:center;text-decoration:none" href="${wa(k)}" target="_blank" rel="noopener">Hubungi lewat WhatsApp</a>
 ${mine.some(m=>m.id===id)?`<button class="btn alt" data-del="${id}">Hapus kos ini</button>`:""}`;
 $("#dd").showModal();
}
function bar(){
 $("#cmpbar").style.display=cmp.length?"flex":"none";
 $("#cmpn").textContent=cmp.length+" kos dipilih (maks 3)";
 $("#cmpgo").disabled=cmp.length<2;$("#cmpgo").style.opacity=cmp.length<2?.5:1;
}
document.addEventListener("click",e=>{
 const t=e.target;
 if(t.dataset.d)detail(t.dataset.d);
 if(t.hasAttribute("data-close"))t.closest("dialog").close();
 if(t.dataset.del){mine=mine.filter(m=>m.id!==t.dataset.del);save();cmp=cmp.filter(c=>c!==t.dataset.del);$("#dd").close();render();bar()}
});
document.addEventListener("change",e=>{
 const t=e.target;
 if(t.dataset.c){
  if(t.checked){if(cmp.length>=3){t.checked=false;return}cmp.push(t.dataset.c)}else cmp=cmp.filter(c=>c!==t.dataset.c);
  bar();
 }else if(t.closest(".panel"))render();
});
$(".panel").addEventListener("input",render);
$("#reset").onclick=()=>{document.querySelectorAll(".panel input,.panel select").forEach(x=>{x.type==="checkbox"?x.checked=false:x.value=x.tagName==="SELECT"?x.options[0].value:""});$("#fs").value="d";render()};
$("#cmpclr").onclick=()=>{cmp=[];bar();render()};
$("#cmpgo").onclick=()=>{
 const ks=cmp.map(id=>all().find(k=>k.id===id)).filter(Boolean);
 const rows=[["Harga/bulan",k=>rp(k.harga)],["Jarak",k=>k.jarak+" km"],["Tipe",k=>k.tipe],["Kamar kosong",k=>k.kosong?"Ya":"Tidak"],...FAC.map(f=>[f,k=>k.fac.includes(f)?"Ya":"-"])];
 $("#cmpt").innerHTML=`<table><tr><th></th>${ks.map(k=>`<th>${esc(k.nama)}</th>`).join("")}</tr>${rows.map(r=>`<tr><th>${r[0]}</th>${ks.map(k=>`<td>${esc(r[1](k))}</td>`).join("")}</tr>`).join("")}</table>`;
 $("#dc").showModal();
};
$("#add").onclick=()=>$("#da").showModal();
$("#af").addEventListener("submit",e=>{
 const f=new FormData(e.target);
 mine.unshift({id:"m"+Date.now(),nama:f.get("nama").trim(),alamat:f.get("alamat").trim(),harga:+f.get("harga"),jarak:+f.get("jarak"),tipe:f.get("tipe"),wa:f.get("wa").trim(),foto:f.get("foto")||"",kosong:f.get("kosong")==="on",fac:f.getAll("fac"),upd:new Date().toISOString().slice(0,10)});
 save();e.target.reset();render();
});
render();bar();
</script>
